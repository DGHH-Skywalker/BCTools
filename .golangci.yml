run:
  timeout: 5m
  skip-dirs:
    - ffmpeg_bctools_mini

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive

linters-settings:
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: indent-error-flow

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10
