name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "24.7.0"
  PNPM_VERSION: "10.15.1"
  GOPROXY: "https://goproxy.cn,direct"

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: GoServer/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Web/package-lock.json

      - name: Restore FFmpeg cache
        id: cache
        uses: actions/cache@v4
        with:
          path: GoServer/ffmpeg_bctools_mini/dist
          key: ffmpeg-mini-${{ runner.os }}-${{ hashFiles('GoServer/ffmpeg_bctools_mini/build.sh') }}

      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-lame
            git
            make
            pkg-config

      - name: Build bundled FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: GoServer/ffmpeg_bctools_mini
        run: bash build.sh

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Use the pinned pnpm version
        run: corepack install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install Vue dependencies
        run: npm --prefix Web ci --legacy-peer-deps

      - name: Install React dependencies
        run: corepack pnpm --dir Web/um-react install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Write checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum bctools.exe BCTools-Setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          body_path: docs/releases/${{ github.event.inputs.tag || github.ref_name }}.md
          files: |
            dist/BCTools-Setup.exe
            dist/bctools.exe
            dist/SHA256SUMS.txt
