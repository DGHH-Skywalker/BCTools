name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const version = require('./package.json').version
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG) ||
              process.env.RELEASE_TAG !== 'v' + version) {
            throw new Error('Release tag must equal v' + version)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'prerelease=' + version.includes('-') + '\n')
          JS

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: refs/tags/${{ inputs.tag || github.ref_name }}

  publish:
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: bctools-windows
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: BCTools ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.prerelease != 'true' }}
          body_path: docs/releases/${{ inputs.tag || github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/BCTools-Setup.exe
            dist/bctools.exe
            dist/BCTools-UpdateTargets.zip
            dist/FFmpeg-Sources.tar.gz
            dist/SHA256SUMS.txt
