name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.7.0"
  PNPM_VERSION: "10.15.1"
  GOPROXY: "https://proxy.golang.org|https://goproxy.cn|https://mirrors.aliyun.com/goproxy|direct"

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: GoServer/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Web/package-lock.json

      - name: Use the pinned pnpm version
        run: corepack install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install Vue dependencies
        run: npm --prefix Web ci --legacy-peer-deps

      - name: Install React dependencies
        run: corepack pnpm@10.15.1 --dir Web/um-react install --frozen-lockfile

      - name: Type checks and Go vet
        run: npm run type-check

      - name: Frontend and Go tests
        run: npm run test

      - name: React type check and tests
        run: |
          corepack pnpm@10.15.1 --dir Web/um-react exec tsc -p tsconfig.prod.json --noEmit
          corepack pnpm@10.15.1 --dir Web/um-react test

      - name: Verify generated API contracts
        run: |
          npm run generate:api
          git diff --exit-code -- GoServer/internal/contracts/types.gen.go Web/src/api/generated/contracts.ts

  ffmpeg:
    name: Build bundled FFmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Restore FFmpeg cache
        id: cache
        uses: actions/cache@v4
        with:
          path: GoServer/ffmpeg_bctools_mini/dist
          key: ffmpeg-mini-${{ runner.os }}-${{ hashFiles('GoServer/ffmpeg_bctools_mini/build.sh') }}

      - name: Install MSYS2 dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nasm
            curl
            zstd
            git
            make
            pkg-config

      - name: Build bundled FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: GoServer/ffmpeg_bctools_mini
        env:
          BCTOOLS_PACKAGE_FFMPEG_SOURCE: '1'
        run: |
          if ! bash build.sh; then
            if [ -f src/ffmpeg/ffbuild/config.log ]; then tail -160 src/ffmpeg/ffbuild/config.log; fi
            exit 1
          fi

      - name: Validate bundled FFmpeg
        shell: bash
        working-directory: GoServer/ffmpeg_bctools_mini/dist
        run: |
          ls -lh ffmpeg.exe ffprobe.exe FFmpeg-Sources.tar.gz
          ./ffmpeg.exe -hide_banner -encoders | grep -q libmp3lame

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-mini
          path: |
            GoServer/ffmpeg_bctools_mini/dist/*.exe
            GoServer/ffmpeg_bctools_mini/dist/FFmpeg-Sources.tar.gz
          retention-days: 1

  build:
    name: Build Windows artifacts
    needs: [test, ffmpeg]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: GoServer/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Web/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Use the pinned pnpm version
        run: corepack install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install Vue dependencies
        run: npm --prefix Web ci --legacy-peer-deps

      - name: Install React dependencies
        run: corepack pnpm@10.15.1 --dir Web/um-react install --frozen-lockfile

      - name: Download bundled FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-mini
          path: GoServer/ffmpeg_bctools_mini/dist

      - name: Configure signed update source
        env:
          BCTOOLS_UPDATE_REPO: ${{ vars.BCTOOLS_UPDATE_REPO }}
          BCTOOLS_TUF_ROOT_JSON: ${{ vars.BCTOOLS_TUF_ROOT_JSON }}
          BCTOOLS_UPDATE_BRANCH: ${{ vars.BCTOOLS_UPDATE_BRANCH }}
          BCTOOLS_UPDATE_MIRRORS: ${{ vars.BCTOOLS_UPDATE_MIRRORS }}
        run: node scripts/configure-update-source.cjs

      - name: Build
        run: npm run build

      - name: Smoke-test silent install and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Prepare update feed targets
        shell: pwsh
        run: ./scripts/package-update-feed.ps1

      - name: Check release versions and write checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $numeric = (Get-Content GoServer/versioninfo.json | ConvertFrom-Json).FixedFileInfo.FileVersion
          $expected = "$($numeric.Major).$($numeric.Minor).$($numeric.Patch).$($numeric.Build)"
          foreach ($name in @("bctools.exe", "BCTools-Setup.exe")) {
            $info = (Get-Item (Join-Path dist $name)).VersionInfo
            $actual = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
            # Inno reserves extra space in these textual version values.
            if ($actual -ne $expected -or ([string]$info.FileVersion).TrimEnd() -ne $expected -or ([string]$info.ProductVersion).TrimEnd() -ne $version) {
              throw "$name has unexpected versions: $actual / $($info.FileVersion) / $($info.ProductVersion)"
            }
          }
          Copy-Item GoServer/ffmpeg_bctools_mini/dist/FFmpeg-Sources.tar.gz dist/
          Set-Location dist
          $checksums = Get-FileHash -Algorithm SHA256 bctools.exe,BCTools-Setup.exe,BCTools-UpdateTargets.zip,FFmpeg-Sources.tar.gz |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" }
          $checksums | Set-Content -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bctools-windows
          path: |
            dist/bctools.exe
            dist/BCTools-Setup.exe
            dist/BCTools-UpdateTargets.zip
            dist/FFmpeg-Sources.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
