name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.7.0"
  PNPM_VERSION: "10.15.1"

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: GoServer/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Web/package-lock.json

      - name: Use the pinned pnpm version
        run: corepack install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install Vue dependencies
        run: npm --prefix Web ci --legacy-peer-deps

      - name: Install React dependencies
        run: corepack pnpm --dir Web/um-react install --frozen-lockfile

      - name: Go vet
        run: go -C GoServer vet -mod=readonly ./...

      - name: Go tests
        run: go -C GoServer test -mod=readonly ./...

      - name: Vue type check
        run: npm --prefix Web run type-check

      - name: Vue tests
        run: npm --prefix Web run test

      - name: React type check
        run: corepack pnpm --dir Web/um-react exec tsc -p tsconfig.prod.json --noEmit

  ffmpeg:
    name: Build bundled FFmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore FFmpeg cache
        id: cache
        uses: actions/cache@v4
        with:
          path: GoServer/ffmpeg_bctools_mini/dist
          key: ffmpeg-mini-${{ runner.os }}-${{ hashFiles('GoServer/ffmpeg_bctools_mini/build.sh') }}

      - name: Install MSYS2 dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-lame
            git
            make
            pkg-config

      - name: Build bundled FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: GoServer/ffmpeg_bctools_mini
        run: bash build.sh

      - name: Validate bundled FFmpeg
        shell: bash
        working-directory: GoServer/ffmpeg_bctools_mini/dist
        run: |
          ls -lh ffmpeg.exe ffprobe.exe
          ./ffmpeg.exe -hide_banner -encoders | grep -q libmp3lame

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-mini
          path: GoServer/ffmpeg_bctools_mini/dist/*.exe
          retention-days: 1

  build:
    name: Build Windows artifacts
    needs: [test, ffmpeg]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: GoServer/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Web/package-lock.json

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            make

      - name: Add MinGW-w64 to PATH
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Use the pinned pnpm version
        run: corepack install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install Vue dependencies
        run: npm --prefix Web ci --legacy-peer-deps

      - name: Install React dependencies
        run: corepack pnpm --dir Web/um-react install --frozen-lockfile

      - name: Download bundled FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-mini
          path: GoServer/ffmpeg_bctools_mini/dist

      - name: Build
        run: npm run build

      - name: List artifacts
        shell: bash
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bctools-${{ github.sha }}
          path: dist/bctools.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: BCTools-Setup-${{ github.sha }}
          path: dist/BCTools-Setup.exe
          if-no-files-found: error
          retention-days: 14
